name: Payment notification receiver watchdog
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: connext-watchdog
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check receiver from outside the desktop
        run: curl --silent --show-error --fail --retry 2 --max-time 25 https://sawaddikanthali.vercel.app/api/connext-health
